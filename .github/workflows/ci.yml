name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install GrapeTree and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check
      - name: Compile all Python sources
        run: python -m compileall -q grapetree grapetree.py simulation_generate.py simulation_getTrees.py simulations
      - name: Run tests
        run: |
          cp -R tests "${RUNNER_TEMP}/tests"
          cd "${RUNNER_TEMP}"
          python -m pytest -q tests

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test editable install
        run: |
          python -m pip install --editable .
          python -c "import grapetree; assert grapetree.__version__ == '2.3.0'"
          grapetree --version
      - name: Smoke-test the source distribution
        run: |
          python -m pip install --force-reinstall dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          python -c "from grapetree import app; assert app.test_client().get('/').status_code == 200"
      - name: Smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "from grapetree import app; assert app.test_client().get('/').status_code == 200"
          grapetree --help
          grapetree --version

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install GrapeTree
        run: python -m pip install .
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:browser

  docker:
    name: Docker application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Build container image
        run: docker build --tag grapetree:test .
      - name: Run server and calculate a tree
        run: |
          docker run --detach --name grapetree-test --publish 8000:8000 grapetree:test
          trap 'docker logs grapetree-test' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/ > /dev/null
          curl --fail \
            --data-urlencode "profile@examples/simulated_data.profile" \
            --data "method=MSTreeV2" \
            --data "checkEnv=" \
            http://127.0.0.1:8000/maketree > docker-tree.nwk
          grep --quiet ';' docker-tree.nwk

  platform:
    name: ${{ matrix.name }} compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GrapeTree and test dependencies
        run: python -m pip install . pytest
      - name: Run installed-package tests
        run: |
          cp -R tests "${RUNNER_TEMP}/tests"
          cd "${RUNNER_TEMP}"
          python -m pytest -q tests
        shell: bash

  native-macos:
    name: Build macOS Intel application
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application build dependencies
        run: python -m pip install . pyinstaller
      - name: Build application bundle
        run: ./build_mac.sh
      - name: Smoke-test packaged command
        run: |
          test "$(dist/GrapeTree.app/Contents/MacOS/GrapeTree --version)" = "GrapeTree 2.3.0"
          dist/GrapeTree.app/Contents/MacOS/GrapeTree --profile examples/simulated_data.profile --method MSTreeV2 --n_proc 1 > mstree.nwk
          dist/GrapeTree.app/Contents/MacOS/GrapeTree --profile examples/simulated_data.profile --method NJ --n_proc 1 > nj.nwk
          dist/GrapeTree.app/Contents/MacOS/GrapeTree --profile examples/simulated_data.profile --method RapidNJ --n_proc 1 > rapidnj.nwk
          test -s mstree.nwk
          test -s nj.nwk
          test -s rapidnj.nwk
          test "$(file -b dist/GrapeTree.app/Contents/MacOS/GrapeTree)" != ""
      - uses: actions/upload-artifact@v4
        with:
          name: GrapeTree-macOS-Intel
          path: dist/GrapeTree.app
          if-no-files-found: error

  native-windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application build dependencies
        run: python -m pip install . pyinstaller
      - name: Build application bundle
        run: .\build_win.bat
        shell: cmd
      - name: Smoke-test packaged command
        shell: pwsh
        run: |
          $version = & ".\dist\GrapeTree\GrapeTree.exe" --version
          if ($version -notmatch '^GrapeTree(?:\.exe)? 2\.3\.0$') { throw "Unexpected version: $version" }
          & ".\dist\GrapeTree\GrapeTree.exe" --profile examples\simulated_data.profile --method MSTreeV2 --n_proc 1 | Out-File -Encoding ascii mstree.nwk
          & ".\dist\GrapeTree\GrapeTree.exe" --profile examples\simulated_data.profile --method NJ --n_proc 1 | Out-File -Encoding ascii nj.nwk
          & ".\dist\GrapeTree\GrapeTree.exe" --profile examples\simulated_data.profile --method RapidNJ --n_proc 1 | Out-File -Encoding ascii rapidnj.nwk
          foreach ($tree in @("mstree.nwk", "nj.nwk", "rapidnj.nwk")) {
            if (-not (Test-Path $tree) -or (Get-Item $tree).Length -eq 0) { throw "Empty tree: $tree" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GrapeTree-Windows
          path: dist/GrapeTree
          if-no-files-found: error
