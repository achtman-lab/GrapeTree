name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep archive sampling, full scientific parity and benchmarks out of this workflow.
# TESTING.md describes the opt-in local review tiers. The jobs below run in parallel.
jobs:
  test:
    timeout-minutes: 5
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install GrapeTree and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check
      - name: Compile all Python sources
        run: python -m compileall -q grapetree grapetree.py simulation_generate.py simulation_getTrees.py simulations
      - name: Run tests
        run: |
          cp -R tests "${RUNNER_TEMP}/tests"
          cd "${RUNNER_TEMP}"
          python -m pytest -q tests

      - name: Check the scientific review harness
        if: matrix.python-version == '3.12'
        run: python -m pytest -q review/harness review/test_wasm_precision.py review/test_native_version.py

  package:
    timeout-minutes: 5
    name: Build and inspect package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test editable install
        run: |
          python -m pip install --editable .
          python -c "import grapetree; assert grapetree.__version__ == '3.0.0'"
          grapetree --version
      - name: Test clean installs of the source distribution and wheel
        run: python packaging/check_distributions.py dist/*.tar.gz dist/*.whl

  conda-package:
    timeout-minutes: 10
    name: Build Conda recipe
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: conda-build
          python-version: "3.12"
          channels: conda-forge,bioconda
          conda-remove-defaults: true
      - name: Install conda-build
        run: conda install --yes conda-build
      - name: Build and test recipe
        env:
          GRAPETREE_CONDA_SOURCE_PATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}
        run: conda-build conda --override-channels --channel conda-forge --channel bioconda

  browser:
    timeout-minutes: 5
    name: Browser smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install GrapeTree
        run: python -m pip install .
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:browser

  browser-wasm-build:
    timeout-minutes: 10
    name: Rebuild browser WASM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Compile Edmonds WebAssembly reproducibly
        run: ./browser-wasm/compile-docker.sh
      - name: Verify committed browser artefacts are current
        run: git diff --exit-code -- browser-wasm/vendor

  docker:
    timeout-minutes: 5
    name: Docker application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Build container image
        run: docker build --tag grapetree:test .
      - name: Run server and calculate a tree
        run: |
          docker run --detach --name grapetree-test --publish 8000:8000 grapetree:test
          trap 'docker logs grapetree-test' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/ > /dev/null
          curl --fail \
            --data-urlencode "profile@examples/simulated_data.profile" \
            --data "method=MSTreeV2" \
            --data "checkEnv=0" \
            http://127.0.0.1:8000/maketree > docker-tree.nwk
          grep --quiet ';' docker-tree.nwk

  platform:
    timeout-minutes: 10
    name: ${{ matrix.name }} compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GrapeTree and test dependencies
        run: python -m pip install . pytest
      - name: Run installed-package tests
        run: |
          cp -R tests "${RUNNER_TEMP}/tests"
          cd "${RUNNER_TEMP}"
          python -m pytest -q tests
        shell: bash

  native-macos:
    timeout-minutes: 10
    name: Build macOS Intel application
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application build dependencies
        run: python -m pip install . pyinstaller
      - name: Build application bundle
        run: ./build_mac.sh
      - name: Smoke-test packaged command
        run: |
          test "$(dist/GrapeTree.app/Contents/MacOS/GrapeTree --version)" = "GrapeTree 3.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/GrapeTree.app/Contents/Info.plist)" = "3.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/GrapeTree.app/Contents/Info.plist)" = "3.0.0"
          dist/GrapeTree.app/Contents/MacOS/GrapeTree --profile examples/simulated_data.profile --method MSTreeV2 --n_proc 1 > mstree.nwk
          dist/GrapeTree.app/Contents/MacOS/GrapeTree --profile examples/simulated_data.profile --method NJ --n_proc 1 > nj.nwk
          dist/GrapeTree.app/Contents/MacOS/GrapeTree --profile examples/simulated_data.profile --method RapidNJ --n_proc 1 > rapidnj.nwk
          test -s mstree.nwk
          test -s nj.nwk
          test -s rapidnj.nwk
          test "$(file -b dist/GrapeTree.app/Contents/MacOS/GrapeTree)" != ""
      - uses: actions/upload-artifact@v4
        with:
          name: GrapeTree-macOS-Intel
          path: dist/GrapeTree.app
          if-no-files-found: error

  native-windows:
    timeout-minutes: 10
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application build dependencies
        run: python -m pip install . pyinstaller
      - name: Build application bundle
        run: .\build_win.bat
        shell: cmd
      - name: Smoke-test packaged command
        shell: pwsh
        run: |
          $version = & ".\dist\GrapeTree\GrapeTree.exe" --version
          if ($version -notmatch '^GrapeTree(?:\.exe)? 3\.0\.0$') { throw "Unexpected version: $version" }
          $fileVersion = (Get-Item ".\dist\GrapeTree\GrapeTree.exe").VersionInfo
          if ($fileVersion.FileVersion -ne '3.0.0' -or $fileVersion.ProductVersion -ne '3.0.0') { throw "Unexpected executable version metadata" }
          & ".\dist\GrapeTree\GrapeTree.exe" --profile examples\simulated_data.profile --method MSTreeV2 --n_proc 1 | Out-File -Encoding ascii mstree.nwk
          & ".\dist\GrapeTree\GrapeTree.exe" --profile examples\simulated_data.profile --method NJ --n_proc 1 | Out-File -Encoding ascii nj.nwk
          & ".\dist\GrapeTree\GrapeTree.exe" --profile examples\simulated_data.profile --method RapidNJ --n_proc 1 | Out-File -Encoding ascii rapidnj.nwk
          foreach ($tree in @("mstree.nwk", "nj.nwk", "rapidnj.nwk")) {
            if (-not (Test-Path $tree) -or (Get-Item $tree).Length -eq 0) { throw "Empty tree: $tree" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GrapeTree-Windows
          path: dist/GrapeTree
          if-no-files-found: error
