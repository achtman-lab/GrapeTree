name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  python-distributions:
    name: Build and test Python distributions
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version=$(python -c "exec(open('grapetree/_version.py').read()); print(__version__)")
          test "${RELEASE_TAG}" = "v${package_version}"
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Test clean installs before publication
        run: python packaging/check_distributions.py --require-architecture x86_64 dist/*.tar.gz dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  wheel-compatibility:
    name: Test release wheel on ${{ matrix.name }}
    needs: python-distributions
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
            architecture: x86_64
            python-architecture: x64
          - name: macOS Apple silicon
            os: macos-15
            architecture: arm64
            python-architecture: arm64
          - name: Windows x64
            os: windows-latest
            architecture: x86_64
            python-architecture: x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-architecture }}
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Test the exact release wheel and native backends
        shell: bash
        run: python packaging/check_distributions.py --require-architecture ${{ matrix.architecture }} dist/*.whl

  macos-application:
    timeout-minutes: 10
    name: Build macOS ${{ matrix.name }} application
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            os: macos-15-intel
            architecture: x86_64
            python-architecture: x64
          - name: AppleSilicon
            os: macos-15
            architecture: arm64
            python-architecture: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}
          cache: pip
      - name: Build and test the native application
        run: |
          python -m pip install . pyinstaller
          ./build_mac.sh
          version=$(python -c "exec(open('grapetree/_version.py').read()); print(__version__)")
          python packaging/check_macos_app.py dist/GrapeTree.app --architecture ${{ matrix.architecture }} --version "$version"
      - name: Create portable archive
        run: |
          version=$(python -c "exec(open('grapetree/_version.py').read()); print(__version__)")
          archive="GrapeTree-${version}-macOS-${{ matrix.name }}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/GrapeTree.app "$archive"
          ditto -x -k "$archive" "${RUNNER_TEMP}/extracted"
          python packaging/check_macos_app.py "${RUNNER_TEMP}/extracted/GrapeTree.app" --architecture ${{ matrix.architecture }} --version "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: GrapeTree-macOS-${{ matrix.name }}
          path: GrapeTree-*-macOS-${{ matrix.name }}.zip
          if-no-files-found: error

  windows-application:
    name: Package Windows application
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and smoke-test application
        shell: pwsh
        run: |
          python -m pip install . pyinstaller
          .\build_win.bat
          if ($LASTEXITCODE -ne 0) { throw "Application build failed" }
          $expectedVersion = python -c "exec(open('grapetree/_version.py').read()); print(__version__)"
          $fileVersion = (Get-Item ".\dist\GrapeTree\GrapeTree.exe").VersionInfo
          if ($fileVersion.FileVersion -ne $expectedVersion -or $fileVersion.ProductVersion -ne $expectedVersion) { throw "Unexpected executable version metadata" }
          foreach ($method in @("MSTreeV2", "NJ", "RapidNJ")) {
            & ".\dist\GrapeTree\GrapeTree.exe" --profile examples\simulated_data.profile --method $method --n_proc 1 | Out-File -Encoding ascii "$method.nwk"
            if ($LASTEXITCODE -ne 0) { throw "$method calculation failed" }
            if ((Get-Item "$method.nwk").Length -eq 0) { throw "$method produced no tree" }
          }
      - name: Create portable archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          Compress-Archive -Path dist\GrapeTree -DestinationPath "GrapeTree-$version-Windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-application
          path: GrapeTree-*-Windows.zip
          if-no-files-found: error

  browser-application:
    name: Package static browser application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build static browser archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir GrapeTree-browser
          cp -R MSTree_holder.html static browser-wasm GrapeTree-browser/
          tar -czf "GrapeTree-${RELEASE_TAG#v}-browser.tar.gz" GrapeTree-browser
      - uses: actions/upload-artifact@v7
        with:
          name: browser-application
          path: GrapeTree-*-browser.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [python-distributions, wheel-compatibility]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/grapetree
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish with trusted identity
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release-assets:
    name: Attach release archives and checksums
    needs:
      - python-distributions
      - wheel-compatibility
      - macos-application
      - windows-application
      - browser-application
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Attach files to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" release-assets/* --clobber
