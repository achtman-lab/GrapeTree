{% set name = "grapetree" %}
{% set version = "2.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Use the modernization branch until v2.3.0 is tagged. Replace this with the
  # release tarball URL and SHA-256 before submitting the recipe to Bioconda.
  git_url: https://github.com/achtman-lab/GrapeTree.git
  git_rev: codex/modernize-packaging-ci

build:
  number: 0
  # GrapeTree bundles x86-64 executables for its tree-building backends.
  skip: true  # [not x86_64 or py<310 or py>314]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vv
  entry_points:
    - grapetree = grapetree.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.10,<3.15
    - pip
    - hatchling
  run:
    - python >=3.10,<3.15
    - ete3 >=3.1.3
    - flask
    - legacy-cgi >=2.6.4
    - networkx
    - numba
    - numpy
    - pandas
    - psutil
    - requests
    - unidecode

test:
  imports:
    - grapetree
    - grapetree.cli
    - grapetree.module.MSTrees
  commands:
    - grapetree --help
    - grapetree --version
    - python -c "from grapetree import app; assert app.test_client().get('/').status_code == 200"
    - test -x "$SP_DIR/grapetree/binaries/edmonds-linux"  # [linux]
    - test -x "$SP_DIR/grapetree/binaries/edmonds-osx"  # [osx]

about:
  home: https://github.com/achtman-lab/GrapeTree
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  summary: "Interactive visualization and analysis of large phylogenetic trees"
  description: |
    GrapeTree is a browser-based tool for generating, visualizing, and
    manipulating phylogenetic trees, including minimum spanning trees from
    MLST and cgMLST profiles. It can run as a local web application or as a
    command-line tree-building tool.
  dev_url: https://github.com/achtman-lab/GrapeTree
  doc_url: https://achtman-lab.github.io/GrapeTree/MSTree_holder.html

extra:
  recipe-maintainers:
    - simonhtausch
    - happykhan
